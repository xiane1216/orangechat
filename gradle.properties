# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2600m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Kotlin 编译在 Gradle daemon 进程内执行(in-process):
# 1. 避免容器内 fork 新 Kotlin daemon JVM 时触发 cgroup v2 崩溃(CgroupInfo NPE)
# 2. 单一大堆替代 Gradle+Kotlin 两个 JVM 叠加, 降低 4GB 容器内的峰值内存
kotlin.compiler.execution.strategy=in-process
# Kotlin 编译器在 daemon 内的堆上限, 防止编译期把 daemon 撑爆被 OOM-kill
kotlin.daemon.jvmargs=-Xmx1200m
# Enable Gradle daemon to keep it alive between builds
org.gradle.daemon=true
# 沙箱内存受限，关闭并行构建降低峰值内存
org.gradle.parallel=false
# 单 worker 打包, 进一步压低 packageRelease 阶段峰值内存
org.gradle.workers.max=1
# Enable build cache to speed up incremental builds
org.gradle.caching=true
# Enable configuration cache (incubating)
org.gradle.configuration-cache=false
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Override path check for non-ASCII characters in project directory
android.overridePathCheck=true
# Proxy settings for dependency downloads
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
# 增加依赖下载超时容错，避免代理抖动导致构建失败
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000
# 本地 JDK 17 工具链探测路径（mise/常见 JVM 目录；不存在的路径会被 Gradle 忽略，
# 找不到时回退 foojay 自动下载，避免依赖外部网络的工具链下载失败）
org.gradle.java.installations.paths=/root/.local/share/mise/installs/java/17.0.2,/root/.local/share/mise/installs/java/17,/usr/lib/jvm
